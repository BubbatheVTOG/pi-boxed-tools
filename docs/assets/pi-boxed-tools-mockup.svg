<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="userBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d28"/>
      <stop offset="1" stop-color="#111721"/>
    </linearGradient>
    <linearGradient id="toolBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10151e"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .sans { font-family: Inter, 'DejaVu Sans', sans-serif; }
      .body { fill: #d8dee9; font-size: 18px; }
      .muted { fill: #8b95a7; }
      .dim { fill: #667085; }
      .accent { fill: #69b7ff; }
      .green { fill: #72d6a0; }
      .cyan { fill: #71d7e8; }
      .purple { fill: #c5a6ff; }
      .border { stroke: #303b4c; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="36" y="28" width="1528" height="844" rx="14" fill="#05070a" opacity=".75" filter="url(#shadow)"/>
  <rect x="36" y="28" width="1528" height="844" rx="14" fill="url(#bg)" stroke="#344052" stroke-width="2"/>

  <!-- chrome -->
  <rect x="36" y="28" width="1528" height="50" rx="14" fill="#121923"/>
  <rect x="36" y="58" width="1528" height="20" fill="#121923"/>
  <circle cx="68" cy="53" r="7" fill="#ff6b6b"/><circle cx="92" cy="53" r="7" fill="#ffd166"/><circle cx="116" cy="53" r="7" fill="#72d6a0"/>
  <text x="148" y="60" class="mono muted" font-size="17">pi-boxed-tools  •  interactive demo</text>
  <text x="1510" y="60" text-anchor="end" class="mono dim" font-size="15">local vLLM  ·  256k</text>

  <!-- user message -->
  <rect x="70" y="108" width="1460" height="112" rx="9" fill="url(#userBg)" stroke="#425268" stroke-width="2"/>
  <text x="94" y="140" class="mono accent" font-size="16" font-weight="700">user</text>
  <text x="94" y="176" class="mono body">Show me a compact, readable view of the tools I'm using.</text>

  <text x="72" y="258" class="mono muted" font-size="16" font-style="italic">Thinking: rendering tool calls as focused, expandable boxes…</text>

  <!-- bash tool -->
  <text x="72" y="298" class="mono cyan" font-size="17" font-weight="700">bash</text>
  <text x="135" y="298" class="mono muted" font-size="17">printf "demo-one\ndemo-two\ndemo-three\n"</text>
  <rect x="70" y="316" width="1460" height="136" rx="7" fill="url(#toolBg)" stroke="#334153" stroke-width="2"/>
  <text x="94" y="346" class="mono cyan" font-size="16" font-weight="700">bash</text>
  <text x="94" y="380" class="mono body">demo-one</text>
  <text x="94" y="410" class="mono body">demo-two</text>
  <text x="94" y="440" class="mono body">demo-three</text>

  <!-- read tool -->
  <text x="72" y="492" class="mono purple" font-size="17" font-weight="700">read</text>
  <text x="145" y="492" class="mono muted" font-size="17">src/box.ts  ·  preview</text>
  <rect x="70" y="510" width="1460" height="174" rx="7" fill="url(#toolBg)" stroke="#334153" stroke-width="2"/>
  <text x="94" y="540" class="mono purple" font-size="16" font-weight="700">read</text>
  <text x="94" y="575" class="mono body">export class Boxed implements Component {</text>
  <text x="94" y="604" class="mono body">  render(width: number): string[] {</text>
  <text x="94" y="633" class="mono body">    return boxLines(lines, width, theme, style);</text>
  <text x="94" y="662" class="mono dim">… +84 more lines  ·  Ctrl+O to expand</text>

  <!-- web tool -->
  <rect x="70" y="726" width="1460" height="42" rx="6" fill="#102a21"/>
  <text x="94" y="754" class="mono green" font-size="17" font-weight="700">web_search</text>
  <text x="260" y="754" class="mono muted" font-size="17">pi coding agent  ·  1</text>
  <rect x="70" y="768" width="1460" height="72" rx="7" fill="url(#toolBg)" stroke="#334153" stroke-width="2"/>
  <text x="94" y="798" class="mono body">1. Pi Coding Agent</text>
  <text x="94" y="825" class="mono accent">https://pi.dev/</text>

  <text x="1518" y="860" text-anchor="end" class="sans dim" font-size="13">Illustrative mockup · pi-boxed-tools</text>
</svg>
